services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: diploma_user
      POSTGRES_PASSWORD: diploma_pass
      POSTGRES_DB: diploma_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diploma_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  backend:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=django-insecure-8#8b9u6&5#8v9k5#2v6y0v#8b9u6&5#8v9k5#2v6y0v#8b9u6&5
      - DEBUG=True
      - POSTGRES_DB=diploma_db
      - POSTGRES_USER=diploma_user
      - POSTGRES_PASSWORD=diploma_pass
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    build: .
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - SECRET_KEY=django-insecure-8#8b9u6&5#8v9k5#2v6y0v#8b9u6&5#8v9k5#2v6y0v#8b9u6&5
      - DEBUG=True
      - POSTGRES_DB=diploma_db
      - POSTGRES_USER=diploma_user
      - POSTGRES_PASSWORD=diploma_pass
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data: